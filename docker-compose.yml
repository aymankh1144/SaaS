# تجربة محلية قبل الرفع:  docker compose up --build   ثم افتح http://localhost:8080
services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      APP_KEY: "base64:CHANGE_ME_run_php_artisan_key_generate_--show"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: menusaas
      DB_USERNAME: menusaas
      DB_PASSWORD: secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD_HASH: ""   # ضع الهاش هنا (مع تفادي علامة $ بمضاعفتها $$ داخل هذا الملف)
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on: [db]

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: menusaas
      MYSQL_USER: menusaas
      MYSQL_PASSWORD: secret
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  uploads:
  dbdata:
